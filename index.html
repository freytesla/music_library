<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐库 — MUSIC LIBRARY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23018D87'/><path d='M8 3v6m0 0 3-3M8 9 5 6M4 11h8' stroke='%23FFFFFF' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@300;400;500&family=Space+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FREY VISUAL STYLE — 音乐库 MUSIC LIBRARY
   马尔斯绿 #01847F x 黑 x 白 / 瑞士极简 + 克制科技点缀
   ============================================================ */
:root{
  --green:      #01847F;
  --green-600:  #016E6A;
  --green-700:  #015A56;
  --green-400:  #1BA6A0;
  --green-200:  #8FD6D0;
  --green-100:  #D7F4F0;
  --ink:        #0A0D0C;
  --ink-2:      #171C1A;
  --bg:         #050706;
  --paper:      #FFFFFF;
  --paper-2:    #F4F4F2;
  --line:       rgba(10,13,12,.12);
  --line-strong:rgba(10,13,12,.28);
  --muted:      rgba(10,13,12,.58);
  --font-display:'Syne','Noto Sans SC',sans-serif;
  --font-body:  'Space Grotesk','Noto Sans SC',sans-serif;
  --font-mono:  'Space Mono','Noto Sans SC',monospace;
  --ease: cubic-bezier(.22,.61,.21,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:var(--font-body); font-size:15px; line-height:1.65;
  color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; padding:0 1rem;
}
::selection{ background:var(--green); color:var(--paper); }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3{ font-family:var(--font-display); font-weight:800; letter-spacing:-.02em; line-height:.98; }

/* scrollbar */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--green-700); border-radius:99px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--green); }

/* ---------- custom cursor ---------- */
@media (pointer:fine){
  body.has-cursor, body.has-cursor button, body.has-cursor input, body.has-cursor textarea, body.has-cursor select{ cursor:none; }
}
#cur-dot,#cur-ring{ position:fixed; top:0; left:0; z-index:9999; pointer-events:none; border-radius:50%; will-change:transform; }
#cur-dot{ width:8px; height:8px; margin:-4px 0 0 -4px; background:var(--green); }
#cur-ring{
  width:38px; height:38px; margin:-19px 0 0 -19px;
  border:1px solid rgba(245,246,241,.9); mix-blend-mode:difference; opacity:.9;
  transition:width .25s var(--ease), height .25s var(--ease), margin .25s var(--ease), opacity .25s;
}
#cur-ring.is-hover{ width:64px; height:64px; margin:-32px 0 0 -32px; opacity:.5; }
#cur-ring.is-down{ width:24px; height:24px; margin:-12px 0 0 -12px; }
@media (pointer:coarse){ #cur-dot,#cur-ring{ display:none; } }

/* ---------- loader ---------- */
#loader{
  position:fixed; inset:0; z-index:10000; background:var(--bg); color:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px;
  clip-path:inset(0 0 0 0); transition:clip-path .9s var(--ease-out);
}
#loader.done{ clip-path:inset(0 0 100% 0); pointer-events:none; }
.loader__rope{ position:relative; width:1px; height:60px; background:rgba(245,246,241,.16); transform-origin:top; animation:rope-grow .9s var(--ease-out) both; }
.loader__pendant{
  position:absolute; left:50%; top:60px; margin-left:-8px;
  width:16px; height:16px; background:var(--green);
  clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);
  animation:pendant-drop 1.4s cubic-bezier(.3,1.25,.4,1) .2s both;
  box-shadow:0 0 26px rgba(1,132,127,.75);
}
.loader__pendant::after{ content:''; position:absolute; inset:3px; background:var(--bg); clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%); }
@keyframes rope-grow{ from{ transform:scaleY(0);} to{ transform:scaleY(1);} }
@keyframes pendant-drop{ from{ transform:translateY(-46px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.loader__word{ display:flex; gap:.06em; overflow:hidden; font-family:var(--font-display); font-size:clamp(46px,10vw,110px); font-weight:800; letter-spacing:-.02em; line-height:1; }
.loader__word span{ display:inline-block; transform:translateY(120%); animation:loader-in .7s var(--ease-out) forwards; }
.loader__word span:nth-child(1){ animation-delay:.18s; } .loader__word span:nth-child(2){ animation-delay:.25s; }
.loader__word span:nth-child(3){ animation-delay:.32s; } .loader__word span:nth-child(4){ animation-delay:.39s; }
.loader__word span:nth-child(5){ animation-delay:.46s; } .loader__word span:nth-child(6){ animation-delay:.53s; }
.loader__gem{ color:var(--green); }
@keyframes loader-in{ to{ transform:translateY(0); } }
.loader__meta{ width:min(340px,72vw); display:flex; align-items:center; gap:14px; font-family:var(--font-mono); font-size:10px; letter-spacing:.32em; color:rgba(245,246,241,.58); }
.loader__label{ white-space:nowrap; text-transform:uppercase; }
.loader__bar{ position:relative; flex:1; height:1px; background:rgba(245,246,241,.18); overflow:hidden; }
.loader__bar i{ position:absolute; inset:0; background:var(--green); transform-origin:left; transform:scaleX(0); }
.loader__pct{ min-width:40px; text-align:right; letter-spacing:.18em; }

/* ---------- reveal ---------- */
[data-reveal]{ opacity:0; transform:translateY(26px); transition:opacity .8s var(--ease-out), transform .8s var(--ease-out); transition-delay:var(--d,0s); will-change:transform; }
[data-reveal].is-in{ opacity:1; transform:none; }

/* ---------- layout ---------- */
.wrap{ max-width:1200px; margin:0 auto; padding:28px 0 56px; }
.top{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:30px; }
.title{ font-family:var(--font-display); font-size:clamp(40px,6vw,72px); letter-spacing:-.03em; }
.title i{ font-style:normal; color:var(--green); }
.subtitle{ font-family:var(--font-mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
.actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.search{
  background:var(--paper-2); border:1px solid var(--line); border-radius:99px;
  padding:11px 20px; font-size:13px; color:var(--ink); width:220px; outline:none;
  transition:border-color .25s var(--ease), background .25s var(--ease);
}
.search::placeholder{ color:var(--muted); }
.search:focus{ border-color:var(--green); background:#fff; }
.btn{
  position:relative; display:inline-flex; align-items:center; gap:10px; overflow:hidden;
  padding:12px 24px; border-radius:99px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  border:1px solid var(--line-strong); color:var(--ink); background:transparent;
  transition:color .35s var(--ease), border-color .35s;
}
.btn .arr{ transition:transform .35s var(--ease); }
.btn::before{ content:''; position:absolute; inset:0; background:var(--green); transform:scaleY(0); transform-origin:bottom; transition:transform .4s var(--ease); }
.btn:hover{ color:var(--paper); border-color:var(--green); }
.btn:hover::before{ transform:scaleY(1); }
.btn:hover .arr{ transform:translateX(5px); }
.btn > *{ position:relative; z-index:1; }
.btn--solid{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn--solid:hover{ color:var(--paper); }
.btn--green{ background:var(--green); color:var(--paper); border-color:var(--green); }
.btn--green:hover{ color:var(--paper); }

/* ---------- stats ---------- */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:34px; }
.stat-card{ background:var(--paper); padding:20px 22px 18px; position:relative; transition:background .3s var(--ease); }
.stat-card:hover{ background:var(--paper-2); }
.stat-val{ font-family:var(--font-display); font-weight:800; font-size:clamp(28px,4vw,44px); letter-spacing:-.02em; line-height:1; margin-top:10px; font-variant-numeric:tabular-nums; }
.stat-lbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); margin-top:6px; }

/* ---------- filters ---------- */
.filters{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; align-items:center; }
.filter-btn{
  padding:8px 18px; border-radius:99px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.18em;
  border:1px solid var(--line-strong); color:var(--muted); background:transparent;
  transition:all .3s var(--ease);
}
.filter-btn:hover{ color:var(--green); border-color:var(--green); }
.filter-btn.active{ background:var(--green); color:var(--paper); border-color:var(--green); }

/* ---------- track grid ---------- */
.track-grid{ border:1px solid var(--line); background:var(--line); display:flex; flex-direction:column; gap:1px; }
.track-row{
  display:grid; grid-template-columns:2fr 1.5fr 60px 1.2fr 1.2fr 1.5fr 2fr 40px; gap:12px; align-items:center;
  padding:14px 18px; background:var(--paper); cursor:pointer; position:relative;
  transition:background .2s var(--ease);
}
.track-row:not(.header):hover{ background:var(--paper-2); }
.track-row:not(.header)::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--green);
  transform:scaleY(0); transform-origin:bottom; transition:transform .35s var(--ease);
}
.track-row:not(.header):hover::before{ transform:scaleY(1); }
.track-row.header{ background:var(--paper-2); cursor:default; }
.col-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); }
.track-name{ font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.track-artist{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bpm{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; font-family:var(--font-mono); }
.badge{
  display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em;
  padding:3px 9px; border-radius:99px; border:1px solid transparent; white-space:nowrap;
}
.badge-genre{ background:var(--green-100); color:var(--green-700); border-color:rgba(1,132,127,.3); }
.badge-mood{ background:transparent; color:var(--green-600); border-color:var(--line-strong); }
.badge-inst{ background:var(--paper-2); color:var(--ink); border-color:var(--line); }
.fav{ font-size:15px; color:var(--muted); cursor:pointer; user-select:none; text-align:center; transition:color .25s, transform .25s var(--ease); }
.fav:hover{ transform:scale(1.18); }
.fav.liked{ color:var(--green); }
.track-note{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.del-btn{ font-size:14px; color:var(--ink); cursor:pointer; opacity:0; transition:opacity .2s; text-align:center; }
.track-row:hover .del-btn{ opacity:.55; }
.del-btn:hover{ opacity:1 !important; }
.empty{ text-align:center; padding:3.5rem 1rem; color:var(--muted); font-size:13px; font-family:var(--font-mono); letter-spacing:.16em; background:var(--paper); }

/* ---------- modal ---------- */
.modal-bg{ position:fixed; inset:0; background:rgba(5,7,6,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:100; }
.modal-bg.open{ display:flex; }
.modal{
  background:var(--paper); border:1px solid var(--line-strong); border-radius:16px;
  padding:34px 38px 30px; width:560px; max-width:94vw; max-height:86vh; overflow-y:auto;
  animation:modal-in .45s var(--ease-out) both;
}
@keyframes modal-in{ from{ opacity:0; transform:translateY(22px) scale(.98);} to{ opacity:1; transform:none;} }
.modal-title{ font-family:var(--font-display); font-size:clamp(26px,3vw,34px); margin-bottom:26px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 16px; }
.form-group{ display:flex; flex-direction:column; gap:7px; }
.form-group.full{ grid-column:1 / -1; }
.form-label{ font-size:12px; color:var(--muted); }
.form-label b{ color:var(--green); }
.form-input{
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px;
  font-size:14px; color:var(--ink); outline:none; transition:border-color .25s var(--ease);
}
.form-input:focus{ border-color:var(--green); }
.form-input.error{ border-color:var(--green-600); }
.error-tip{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--green-700); display:none; }
.error-tip.show{ display:block; }
.form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:28px; }

/* ---------- footer ---------- */
.foot{ margin-top:44px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; font-family:var(--font-mono); font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); }
.foot b{ color:var(--green); font-weight:400; }

/* ---------- responsive ---------- */
@media (max-width:900px){ .stats{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:768px){
  .track-row{ grid-template-columns:1.5fr 1fr 50px 1fr 1fr 1fr 1.5fr 40px; padding:11px 10px; }
  .search{ width:160px; }
  .top{ flex-direction:column; align-items:flex-start; }
  .actions{ width:100%; justify-content:space-between; }
  .modal{ padding:26px 22px; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001s !important; transition-duration:.001s !important; }
  [data-reveal]{ opacity:1 !important; transform:none !important; }
  #loader{ display:none; }
  #cur-dot,#cur-ring{ display:none; }
}
</style>
</head>
<body>
<!-- custom cursor -->
<div id="cur-dot"></div><div id="cur-ring"></div>

<!-- loader -->
<div id="loader" aria-hidden="true">
  <div class="loader__scene">

<div class="wrap">

  <!-- footer -->
  <div class="foot"><span>数据保存在你的浏览器</span></div>
</div>

<!-- modal -->
<div class="modal-bg" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">添加曲目</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">歌名 <b>*</b></label>
        <input class="form-input" id="f-name" placeholder="歌名">
        <div class="error-tip" id="tip-name">请输入歌名</div>
      </div>
      <div class="form-group">
        <label class="form-label">歌手 <b>*</b></label>
        <input class="form-input" id="f-artist" placeholder="歌手">
        <div class="error-tip" id="tip-artist">请输入歌手</div>
      </div>
      <div class="form-group">
        <label class="form-label">BPM</label>
        <input class="form-input" id="f-bpm" type="number" placeholder="120" min="1" max="300">

    </div>
  </div>

<script>
/* ============ Frey chrome: cursor / loader / reveal ============ */
(function(){
  var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.classList.add('has-cursor');
  var dot = document.getElementById('cur-dot'), ring = document.getElementById('cur-ring');
  if(fine && dot && ring && !reduce){
    var mx=innerWidth/2, my=innerHeight/2, rx=mx, ry=my;
    document.addEventListener('mousemove', function(e){
      mx=e.clientX; my=e.clientY;
      dot.style.transform='translate('+mx+'px,'+my+'px)';
    });
    (function loop(){
      rx+=(mx-rx)*.16; ry+=(my-ry)*.16;
      ring.style.transform='translate('+rx+'px,'+ry+'px)';
      requestAnimationFrame(loop);
    })();
    document.addEventListener('mousedown', function(){ ring.classList.add('is-down'); });
    document.addEventListener('mouseup', function(){ ring.classList.remove('is-down'); });
    document.addEventListener('mouseover', function(e){
      if(e.target.closest && e.target.closest('button, .track-row, .filter-btn, a, input, textarea')) ring.classList.add('is-hover');
    });
    document.addEventListener('mouseout', function(e){
      if(e.target.closest && e.target.closest('button, .track-row, .filter-btn, a, input, textarea')) ring.classList.remove('is-hover');
    });
  } else { dot.style.display='none'; ring.style.display='none'; }

  /* loader progress + reveal */
  var bar = document.getElementById('loadbar'), pct = document.getElementById('loadpct'), p = 0;
  var t = setInterval(function(){ p = Math.min(100, p + Math.random()*18 + 6); if(bar){ bar.style.transform='scaleX('+(p/100)+')'; } if(pct){ pct.textContent = Math.round(p)+'%'; } if(p>=100){ clearInterval(t); setTimeout(function(){ var l=document.getElementById('loader'); if(l){ l.classList.add('done'); setTimeout(function(){ l.style.display='none'; }, 950); } }, 320); } }, 130);
  if(reduce){ clearInterval(t); var l=document.getElementById('loader'); if(l){ l.style.display='none'; } }

  /* scroll reveal */
  var els = document.querySelectorAll('[data-reveal]');
  if(reduce){ els.forEach(function(el){ el.classList.add('is-in'); }); }
  else if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('is-in'); io.unobserve(en.target); } });
    }, {threshold:.12});
    els.forEach(function(el){ io.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('is-in'); }); }
})();
</script>

<script>
// 核心：从localStorage读取数据，无数据则用演示数据
let tracks = JSON.parse(localStorage.getItem('musiclib') || '[]');
let editingId = null;
let currentFilter = 'all';

const DEMO = [
  { id: 1, name: "ghost town", artist: "JVKE", bpm: 82, genre: "Bedroom Pop", mood: "孤寂", inst: "钢琴", note: "氛围感", fav: true },
  { id: 2, name: "Notion", artist: "The Rare Occasions", bpm: 128, genre: "Rock", mood: "清醒", inst: "吉他", note: "抓耳", fav: false },
  { id: 3, name: "i was only temporary 2 u", artist: "my head is empty", bpm: 120, genre: "电子", mood: "孤寂", inst: "合成器", note: "有种蓝调时间的感觉", fav: true },
];

// 首次无数据时加载演示数据并自动保存
if (tracks.length === 0) {
  tracks = DEMO;
  saveToLocalStorage();
}

// 封装自动保存到localStorage的函数
function saveToLocalStorage() {
  try {
    localStorage.setItem('musiclib', JSON.stringify(tracks));
    console.log('数据已自动保存到localStorage');
  } catch(e) {
    console.warn('本地存储保存失败:', e);
  }
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTracks();
}

function buildFilters() {
  const genres = [...new Set(tracks.map(t => t.genre).filter(Boolean))];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '<button class="filter-btn active" onclick="setFilter(\'all\', this)">全部</button>';
  genres.forEach(g => {
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.textContent = g;
    b.onclick = function() { setFilter(g, this); };
    bar.appendChild(b);
  });
  document.querySelectorAll('.filter-btn').forEach(b => {
    if (b.textContent === currentFilter || (currentFilter === 'all' && b.textContent === '全部')) {
      b.classList.add('active');
    }
  });
}

function renderTracks() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = tracks.filter(t => {
    const match = !q || t.name.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q);
    const genreMatch = currentFilter === 'all' || t.genre === currentFilter;
    return match && genreMatch;
  });

  const grid = document.getElementById('trackGrid');
  const empty = document.getElementById('emptyMsg');
  const rows = grid.querySelectorAll('.track-row:not(.header)');
  rows.forEach(r => r.remove());
  if (empty) empty.remove();

  if (list.length === 0) {
    const d = document.createElement('div');
    d.className = 'empty'; d.id = 'emptyMsg';
    d.textContent = tracks.length === 0 ? '还没有曲目，点击「+ 添加」开始吧' : '没有匹配的曲目';
    grid.appendChild(d);
  } else {
    list.forEach(t => {
      const row = document.createElement('div');
      row.className = 'track-row';
      row.innerHTML = `
        <span class="track-name">${t.name}</span>
        <span class="track-artist">${t.artist || '—'}</span>
        <span class="bpm">${t.bpm || '—'}</span>
        <span>${t.genre ? '<span class="badge badge-genre">'+t.genre+'</span>' : '—'}</span>
        <span>${t.mood ? '<span class="badge badge-mood">'+t.mood+'</span>' : '—'}</span>
        <span>${t.inst ? '<span class="badge badge-inst">'+t.inst+'</span>' : '—'}</span>
        <span class="track-note">${t.note || '—'}</span>
        <span style="display: flex; gap: 8px; justify-content: center; align-items: center;">
          <span class="fav ${t.fav ? 'liked' : ''}" onclick="toggleFav(${t.id}, event)">♥</span>
          <span class="del-btn" onclick="deleteTrack(${t.id}, event)">✕</span>
        </span>
      `;
      // 点击行编辑（排除收藏/删除按钮）
      row.onclick = (e) => { 
        if (!e.target.classList.contains('del-btn') && !e.target.classList.contains('fav')) {
          editTrack(t.id);
        }
      };
      grid.appendChild(row);
    });
  }

  document.getElementById('subtitle-count').textContent = tracks.length + ' 首曲目';
  updateStats();
  buildFilters();
}

function updateStats() {
  document.getElementById('s-total').textContent = tracks.length;
  const bpms = tracks.map(t => t.bpm).filter(Boolean);
  document.getElementById('s-bpm').textContent = bpms.length ? Math.round(bpms.reduce((a,b)=>a+b,0)/bpms.length) : '—';
  document.getElementById('s-genres').textContent = new Set(tracks.map(t=>t.genre).filter(Boolean)).size;
  document.getElementById('s-favs').textContent = tracks.filter(t=>t.fav).length;
}

// 收藏切换 - 自动保存
function toggleFav(id, e) {
  e.stopPropagation();
  const idx = tracks.findIndex(t => t.id === id);
  if (idx > -1) {
    tracks[idx].fav = !tracks[idx].fav;
    saveToLocalStorage(); // 自动保存
    renderTracks();
  }
}

function openModal(id) {
  // 清除验证提示
  document.querySelectorAll('.error-tip').forEach(tip => tip.classList.remove('show'));
  document.querySelectorAll('.form-input').forEach(input => input.classList.remove('error'));
  
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '编辑曲目' : '添加曲目';
  const t = id ? tracks.find(x=>x.id===id) : {};
  ['name','artist','bpm','genre','mood','inst','note'].forEach(k => {
    const el = document.getElementById('f-'+k);
    el.value = t ? (t[k] || '') : '';
  });
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('f-name').focus();
}

function editTrack(id) { openModal(id); }

function closeModal() { 
  // 清除验证提示
  document.querySelectorAll('.error-tip').forEach(tip => tip.classList.remove('show'));
  document.querySelectorAll('.form-input').forEach(input => input.classList.remove('error'));
  document.getElementById('modalBg').classList.remove('open'); 
}

function closeModalBg(e) { if (e.target.id === 'modalBg') closeModal(); }

// 保存曲目 - 自动保存
function saveTrack() {
  // 表单验证
  const nameEl = document.getElementById('f-name');
  const artistEl = document.getElementById('f-artist');
  const name = nameEl.value.trim();
  const artist = artistEl.value.trim();
  let isValid = true;

  // 清空验证提示
  document.querySelectorAll('.error-tip').forEach(tip => tip.classList.remove('show'));
  document.querySelectorAll('.form-input').forEach(input => input.classList.remove('error'));

  if (!name) {
    nameEl.classList.add('error');
    document.getElementById('tip-name').classList.add('show');
    nameEl.focus();
    isValid = false;
  }
  
  if (!artist) {
    artistEl.classList.add('error');
    document.getElementById('tip-artist').classList.add('show');
    if (isValid) artistEl.focus();
    isValid = false;
  }

  if (!isValid) return;

  const data = {
    name, 
    artist: artist,
    bpm: document.getElementById('f-bpm').value ? parseInt(document.getElementById('f-bpm').value) : null,
    genre: document.getElementById('f-genre').value.trim(),
    mood: document.getElementById('f-mood').value.trim(),
    inst: document.getElementById('f-inst').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    fav: false
  };
  
  if (editingId) {
    const idx = tracks.findIndex(t=>t.id===editingId);
    if (idx > -1) { 
      data.id = editingId; 
      data.fav = tracks[idx].fav; // 保留收藏状态
      tracks[idx] = data; 
    }
  } else {
    data.id = Date.now();
    tracks.push(data);
  }
  
  saveToLocalStorage(); // 自动保存
  closeModal(); 
  renderTracks();
}

// 删除曲目 - 自动保存
function deleteTrack(id, e) {
  e.stopPropagation();
  if (confirm('确定要删除这首曲目吗？')) {
    tracks = tracks.filter(t=>t.id!==id);
    saveToLocalStorage(); // 自动保存
    renderTracks();
  }
}

// 页面加载完成后渲染
document.addEventListener('DOMContentLoaded', function() {
  renderTracks();
});
</script>
</body>
</html>
